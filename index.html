
<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TI ZNAŠ!</title>

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(ellipse at center, #25080d 0%, #100609 45%, #030203 100%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 20% 30%, #65000d33, transparent 35%),
        radial-gradient(circle at 80% 70%, #76001522, transparent 40%);
    pointer-events: none;
    animation: pulse 5s infinite alternate;
}

@keyframes pulse {
    from { opacity: 0.3; }
    to { opacity: 1; }
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        transparent 0px,
        rgba(255,255,255,0.015) 1px,
        transparent 2px,
        transparent 4px
    );
    pointer-events: none;
}

.container {
    text-align: center;
    width: 95%;
    max-width: 1000px;
    z-index: 2;
    padding: 20px;
}

h1 {
    font-family: 'Creepster', cursive;
    color: #b00018;
    font-size: clamp(65px, 12vw, 125px);
    letter-spacing: 7px;
    text-shadow:
        0 0 10px #b00018,
        0 0 30px #65000b,
        0 0 60px #350006;
    margin-bottom: 55px;
    animation: flicker 4s infinite;
}

@keyframes flicker {
    0%, 18%, 22%, 50%, 54%, 100% {
        opacity: 1;
    }
    20%, 52% {
        opacity: 0.65;
    }
}

.timer {
    font-size: clamp(38px, 9vw, 100px);
    color: #e4dada;
    text-shadow:
        0 0 15px #850016,
        0 0 35px #59000c;
    letter-spacing: 2px;
    white-space: nowrap;
    margin-bottom: 65px;
}

.coffee {
    display: inline-block;
    padding: 18px 38px;
    color: #fff;
    background: linear-gradient(145deg, #780014, #310008);
    border: 1px solid #a0001b;
    border-radius: 5px;
    text-decoration: none;
    font-size: 17px;
    letter-spacing: 2px;
    box-shadow: 0 0 20px #79001566;
    transition: 0.3s;
}

.coffee:hover {
    background: #a0001b;
    box-shadow: 0 0 35px #b00018;
    transform: scale(1.06);
}

.subtitle {
    color: #66545a;
    margin-top: 45px;
    font-size: 12px;
    letter-spacing: 4px;
}

@media(max-width: 500px) {
    h1 {
        margin-bottom: 45px;
        letter-spacing: 3px;
    }

    .timer {
        margin-bottom: 55px;
        letter-spacing: 0;
    }

    .coffee {
        font-size: 14px;
        padding: 16px 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>TI ZNAŠ!</h1>

    <div class="timer" id="timer">
        720h 00m 00s
    </div>

    <a class="coffee"
       href="https://www.paypal.me/gudrash"
       target="_blank"
       rel="noopener noreferrer">
       DODAJ 30d <3
    </a>

    <div class="subtitle">
        DON'T LOOK BACK.
    </div>

</div>

<script>

// =====================================
// ZAJEDNIČKI TAJMER ZA SVE POSETIOCE
// =====================================

// Početak: 3. novembar 2026. u 12:10
// Kraj: 3. decembar 2026. u 12:10

const deadline = new Date(
    "2026-12-03T12:10:00+01:00"
).getTime();


function updateTimer() {

    let remaining = Math.max(0, deadline - Date.now());

    let totalSeconds = Math.floor(remaining / 1000);

    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;

    document.getElementById("timer").textContent =
        hours + "h " +
        String(minutes).padStart(2, "0") + "m " +
        String(seconds).padStart(2, "0") + "s";

    if (remaining <= 0) {
        document.getElementById("timer").textContent = "00h 00m 00s";
    }
}

updateTimer();

setInterval(updateTimer, 1000);

</script>

</body>
</html>
